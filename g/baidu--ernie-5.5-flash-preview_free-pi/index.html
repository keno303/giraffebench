<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Giraffe — a procedural walk</title>
<style>
  :root {
    --ink: #f6efdf;
    --ink-dim: rgba(246, 239, 223, 0.62);
    --panel: rgba(28, 26, 18, 0.42);
    --line: rgba(246, 239, 223, 0.22);
    --accent: #e8c98d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1210; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  #scene { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #scene.grabbing { cursor: grabbing; }

  .vignette {
    position: fixed; inset: 0; pointer-events: none;
    background:
      radial-gradient(120% 90% at 50% 45%, rgba(0,0,0,0) 55%, rgba(10,12,8,0.30) 100%),
      linear-gradient(to bottom, rgba(10,14,12,0.22) 0%, rgba(0,0,0,0) 18%, rgba(0,0,0,0) 72%, rgba(10,12,8,0.30) 100%);
  }

  header {
    position: fixed; top: 0; left: 0; right: 0;
    padding: 26px 30px 0; pointer-events: none;
    display: flex; justify-content: space-between; align-items: flex-start;
  }
  .brand h1 {
    margin: 0;
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    font-size: 30px; font-weight: 500; letter-spacing: 0.16em;
    text-shadow: 0 2px 18px rgba(0,0,0,0.35);
  }
  .brand p {
    margin: 7px 0 0 2px;
    font-size: 10.5px; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--ink-dim);
  }
  .tag {
    font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--ink-dim); text-align: right; line-height: 1.9;
    padding-top: 4px;
  }
  .tag b { color: var(--accent); font-weight: 500; }

  footer {
    position: fixed; left: 0; right: 0; bottom: 0;
    display: flex; justify-content: space-between; align-items: flex-end;
    padding: 0 30px 26px; pointer-events: none;
    gap: 16px;
  }
  .hint {
    font-size: 11px; letter-spacing: 0.09em; color: var(--ink-dim);
    display: flex; gap: 18px; flex-wrap: wrap; padding-bottom: 10px;
  }
  .hint span { display: inline-flex; align-items: center; gap: 7px; }
  .hint i {
    width: 5px; height: 5px; border-radius: 50%; background: var(--accent);
    display: inline-block; opacity: 0.8;
  }
  .controls { display: flex; gap: 8px; pointer-events: auto; }
  button {
    appearance: none; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink);
    padding: 9px 15px; border-radius: 999px;
    font: inherit; font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase;
    cursor: pointer; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    transition: background .2s ease, border-color .2s ease, color .2s ease;
  }
  button:hover { background: rgba(40, 38, 26, 0.62); border-color: rgba(246,239,223,0.4); }
  button.on { color: var(--accent); border-color: rgba(232, 201, 141, 0.45); }

  #loading {
    position: fixed; inset: 0; z-index: 20;
    background: radial-gradient(120% 100% at 50% 40%, #2b3a2c 0%, #141b15 60%, #0b0f0c 100%);
    display: flex; align-items: center; justify-content: center;
    transition: opacity .8s ease;
  }
  #loading.hide { opacity: 0; pointer-events: none; }
  .load-card { text-align: center; }
  .load-card h1 {
    font-family: "Iowan Old Style", Palatino, Georgia, serif;
    font-weight: 400; letter-spacing: 0.24em; font-size: 24px; margin: 0 0 14px;
  }
  .load-card p {
    margin: 0; font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase;
    color: var(--ink-dim);
  }
  .bar {
    width: 150px; height: 1px; background: rgba(246,239,223,0.18);
    margin: 24px auto 0; overflow: hidden;
  }
  .bar::after {
    content: ""; display: block; width: 40%; height: 100%;
    background: var(--accent);
    animation: slide 1.1s ease-in-out infinite;
  }
  @keyframes slide {
    0% { transform: translateX(-110%); }
    100% { transform: translateX(360%); }
  }
  @media (max-width: 640px) {
    header { padding: 18px 18px 0; }
    .brand h1 { font-size: 21px; }
    .tag { display: none; }
    footer { padding: 0 18px 18px; flex-direction: column; align-items: flex-start; gap: 10px; }
    .controls { align-self: flex-end; }
  }
</style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div class="vignette"></div>

  <header>
    <div class="brand">
      <h1>GIRAFFE</h1>
      <p>Giraffa camelopardalis</p>
    </div>
    <div class="tag">
      Procedural model &amp; gait<br>
      <b>Three.js · WebGL</b>
    </div>
  </header>

  <footer>
    <div class="hint">
      <span><i></i>drag to orbit</span>
      <span><i></i>scroll to zoom</span>
      <span><i></i>space to pause</span>
    </div>
    <div class="controls">
      <button id="pause">Pause</button>
      <button id="auto">Auto-orbit on</button>
    </div>
  </footer>

  <div id="loading">
    <div class="load-card">
      <h1>GIRAFFE</h1>
      <p>walking the savanna</p>
      <div class="bar"></div>
    </div>
  </div>

  <script src="vendor/three.min.js"></script>
  <script src="js/textures.js"></script>
  <script src="js/giraffe.js"></script>
  <script src="js/world.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
