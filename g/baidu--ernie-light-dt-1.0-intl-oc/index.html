<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Giraffe Walk — Three.js</title>
<style>
  :root {
    --ink: #f6ecd6;
    --panel: rgba(26, 18, 10, 0.58);
    --line: rgba(255, 235, 200, 0.22);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; background: #0c0f14; color: var(--ink);
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; touch-action: none; }
  #vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background: radial-gradient(ellipse at 50% 42%, rgba(0,0,0,0) 52%, rgba(26, 16, 6, 0.4) 100%);
  }
  .card {
    position: fixed; z-index: 10; background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 14px 16px;
    backdrop-filter: blur(10px) saturate(1.15);
    -webkit-backdrop-filter: blur(10px) saturate(1.15);
    box-shadow: 0 12px 34px rgba(0, 0, 0, 0.38);
  }
  #title { top: 18px; left: 18px; max-width: 330px; }
  #title h1 { font-size: 19px; font-weight: 650; letter-spacing: 0.3px; }
  #title p { margin-top: 5px; font-size: 12.5px; opacity: 0.82; line-height: 1.45; }
  #panel { bottom: 18px; left: 18px; width: 284px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row + .row, .chk, .hint { margin-top: 10px; }
  button {
    appearance: none; border: 1px solid var(--line); background: rgba(255, 240, 210, 0.1);
    color: var(--ink); border-radius: 9px; padding: 7px 12px; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: background 0.15s ease, transform 0.1s ease;
  }
  button:hover { background: rgba(255, 240, 210, 0.2); }
  button:active { transform: translateY(1px); }
  button.primary { background: rgba(216, 161, 78, 0.85); border-color: rgba(255, 225, 170, 0.5); color: #241708; }
  button.primary:hover { background: rgba(230, 176, 92, 0.95); }
  .btnrow { display: flex; gap: 8px; }
  .btnrow button { flex: 1; }
  .lbl { font-size: 12px; opacity: 0.85; min-width: 42px; }
  .val { font-size: 12px; opacity: 0.75; min-width: 34px; text-align: right; font-variant-numeric: tabular-nums; }
  input[type="range"] { flex: 1; accent-color: #d8a14e; }
  .chk { display: flex; align-items: center; gap: 8px; font-size: 12.5px; opacity: 0.9; cursor: pointer; }
  .chk input { accent-color: #d8a14e; }
  .hint { font-size: 11.5px; opacity: 0.6; line-height: 1.5; }
  @media (max-width: 640px) {
    #title { max-width: 250px; padding: 10px 12px; }
    #title h1 { font-size: 16px; }
    #panel { width: calc(100% - 36px); }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="vignette"></div>

<header id="title" class="card">
  <h1>Giraffe Walk</h1>
  <p>A fully procedural reticulated giraffe — articulated legs, lateral-sequence gait, canvas-painted coat — rendered with Three.js. No server, no build step.</p>
</header>

<div id="panel" class="card">
  <div class="btnrow">
    <button id="playBtn" class="primary">Pause</button>
    <button id="resetBtn">Reset view</button>
  </div>
  <div class="row">
    <span class="lbl">Speed</span>
    <input id="speed" type="range" min="0.22" max="0.95" step="0.01" value="0.50">
    <span id="speedVal" class="val">0.50</span>
  </div>
  <label class="chk"><input type="checkbox" id="autoOrbit"> Auto-orbit camera</label>
  <p class="hint">Drag to orbit · scroll / pinch to zoom · Space pauses · R resets the camera</p>
</div>

<script src="three.min.js"></script>
<script>
"use strict";

/* =========================================================================
   Giraffe Walk — procedural reticulated giraffe, lateral-sequence gait.
   Everything is generated in-browser (canvas textures, geometry, animation).
   ========================================================================= */

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;

function makeRNG(seed) {
  let s = seed >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ------------------------------------------------------------------ *
 *  Procedural textures
 * ------------------------------------------------------------------ */

function createCoatTexture(opts) {
  const size = opts.size || 1024;
  const cells = opts.cells || 8;
  const rng = makeRNG(opts.seed || 1);
  const canvas = document.createElement("canvas");
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext("2d");

  const base = opts.base || ["#f2e2bd", "#e9d5a6", "#dfc893"];
  const grad = ctx.createLinearGradient(0, 0, size, size);
  grad.addColorStop(0, base[0]);
  grad.addColorStop(0.55, base[1]);
  grad.addColorStop(1, base[2]);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, size, size);

  // Fine grain
  for (let i = 0; i < 8000; i++) {
    const x = rng() * size, y = rng() * size, r = 0.4 + rng() * 1.9;
    ctx.fillStyle = rng() < 0.5
      ? "rgba(122,82,44," + (0.015 + rng() * 0.035) + ")"
      : "rgba(255,246,220," + (0.015 + rng() * 0.035) + ")";
    ctx.beginPath();
    ctx.arc(x, y, r, 0, 6.2832);
    ctx.fill();
  }

  // Irregular, variable-width mosaic grid (wraps for seamless tiling)
  const widths = [], heights = [];
  let sw = 0, sh = 0;
  for (let i = 0; i < cells; i++) { const w = 0.65 + rng() * 0.75; widths.push(w); sw += w; }
  for (let j = 0; j < cells; j++) { const h = 0.65 + rng() * 0.75; heights.push(h); sh += h; }
  const xs = [0], ys = [0];
  for (let i = 0; i < cells; i++) xs.push(xs[i] + widths[i] / sw * size);
  for (let j = 0; j < cells; j++) ys.push(ys[j] + heights[j] / sh * size);
  xs[cells] = size; ys[cells] = size;
  const minCell = size / cells;

  const jx = [], jy = [];
  for (let i = 0; i < cells; i++) {
    jx[i] = []; jy[i] = [];
    for (let j = 0; j < cells; j++) {
      jx[i][j] = (rng() - 0.5) * 0.62 * minCell;
      jy[i][j] = (rng() - 0.5) * 0.62 * minCell;
    }
  }
  function vtx(i, j) {
    const ii = ((i % cells) + cells) % cells;
    const jj = ((j % cells) + cells) % cells;
    return [
      xs[ii] + jx[ii][jj] + (i >= cells ? size : 0),
      ys[jj] + jy[ii][jj] + (j >= cells ? size : 0)
    ];
  }

  const palette = opts.palette;
  const mergeChance = opts.mergeChance == null ? 0.22 : opts.mergeChance;
  const gap = opts.gap == null ? 0.11 : opts.gap;
  ctx.lineJoin = "round";
  for (let j = 0; j < cells; j++) {
    for (let i = 0; i < cells; i++) {
      const pts = [vtx(i, j), vtx(i + 1, j), vtx(i + 1, j + 1), vtx(i, j + 1)];
      const cx = (pts[0][0] + pts[1][0] + pts[2][0] + pts[3][0]) / 4;
      const cy = (pts[0][1] + pts[1][1] + pts[2][1] + pts[3][1]) / 4;
      const merge = rng() < mergeChance;
      const k = merge ? 1 : 1 - gap * (0.55 + rng() * 0.45);
      ctx.beginPath();
      for (let p = 0; p < 4; p++) {
        const x = cx + (pts[p][0] - cx) * k;
        const y = cy + (pts[p][1] - cy) * k;
        if (p === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fillStyle = palette[(rng() * palette.length) | 0];
      ctx.fill();
      ctx.strokeStyle = opts.stroke || "rgba(74,46,22,0.14)";
      ctx.lineWidth = size * 0.003;
      ctx.stroke();
    }
  }

  // Sparse darker freckles, mostly visible in the pale network
  for (let i = 0; i < 160; i++) {
    const x = rng() * size, y = rng() * size, r = 1.2 + rng() * 3.6;
    ctx.fillStyle = "rgba(96,60,28," + (0.05 + rng() * 0.1) + ")";
    ctx.beginPath();
    ctx.arc(x, y, r, 0, 6.2832);
    ctx.fill();
  }
  return canvas;
}

function createGroundTexture(seed) {
  const size = 1024;
  const rng = makeRNG(seed);
  const canvas = document.createElement("canvas");
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext("2d");

  ctx.fillStyle = "#c9ab77";
  ctx.fillRect(0, 0, size, size);

  function wrap9(x, y, fn) {
    for (let dx = -size; dx <= size; dx += size)
      for (let dy = -size; dy <= size; dy += size) fn(x + dx, y + dy);
  }

  // Broad tonal patches
  for (let i = 0; i < 75; i++) {
    const x = rng() * size, y = rng() * size, r = 60 + rng() * 220;
    const col = ["#b9a267", "#c3ac74", "#b09760", "#cbb47e", "#a8915c"][(rng() * 5) | 0];
    ctx.globalAlpha = 0.12 + rng() * 0.18;
    wrap9(x, y, (px, py) => {
      const g = ctx.createRadialGradient(px, py, 0, px, py, r);
      g.addColorStop(0, col);
      g.addColorStop(1, "rgba(200,170,120,0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(px, py, r, 0, 6.2832);
      ctx.fill();
    });
  }

  // Dry grass strokes
  for (let i = 0; i < 5200; i++) {
    const x = rng() * size, y = rng() * size;
    const len = 4 + rng() * 13;
    const ang = -Math.PI / 2 + (rng() - 0.5) * 1.1;
    ctx.strokeStyle = ["#7d8a4a", "#9aa45c", "#6b7a3e", "#a8a86a", "#8f9b52"][(rng() * 5) | 0];
    ctx.globalAlpha = 0.10 + rng() * 0.22;
    ctx.lineWidth = 0.8 + rng() * 1.4;
    wrap9(x, y, (px, py) => {
      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.lineTo(px + Math.cos(ang) * len, py + Math.sin(ang) * len);
      ctx.stroke();
    });
  }

  // Small stones
  for (let i = 0; i < 95; i++) {
    const x = rng() * size, y = rng() * size, r = 1.2 + rng() * 3.5;
    ctx.fillStyle = ["#9d9384", "#8b8172", "#a9a08f", "#7e7568"][(rng() * 4) | 0];
    ctx.globalAlpha = 0.35 + rng() * 0.4;
    wrap9(x, y, (px, py) => {
      ctx.beginPath();
      ctx.ellipse(px, py, r, r * (0.5 + rng() * 0.5), rng() * 3.14, 0, 6.2832);
      ctx.fill();
    });
  }
  ctx.globalAlpha = 1;
  return canvas;
}

function createGrassTexture() {
  const s = 128;
  const canvas = document.createElement("canvas");
  canvas.width = canvas.height = s;
  const ctx = canvas.getContext("2d");
  const rng = makeRNG(99);
  for (let i = 0; i < 16; i++) {
    const bx = 20 + rng() * 88;
    const tip = bx + (rng() - 0.5) * 46;
    const top = 8 + rng() * 30;
    const w = 3 + rng() * 5;
    ctx.fillStyle = ["#6f7d3f", "#8a9a4d", "#5b6b34", "#98a558", "#7a8744"][(rng() * 5) | 0];
    ctx.globalAlpha = 0.85 + rng() * 0.15;
    ctx.beginPath();
    ctx.moveTo(bx - w, s);
    ctx.quadraticCurveTo(bx - w * 0.4, s - (s - top) * 0.55, tip, top);
    ctx.quadraticCurveTo(bx + w * 0.4, s - (s - top) * 0.55, bx + w, s);
    ctx.closePath();
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  const tex = new THREE.CanvasTexture(canvas);
  tex.encoding = THREE.sRGBEncoding;
  return tex;
}

function createNoiseTexture(seed) {
  const size = 256;
  const canvas = document.createElement("canvas");
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext("2d");
  const img = ctx.createImageData(size, size);
  const rng = makeRNG(seed);
  for (let i = 0; i < size * size; i++) {
    const v = 198 + ((rng() * 57) | 0);
    img.data[i * 4] = v;
    img.data[i * 4 + 1] = v;
    img.data[i * 4 + 2] = v;
    img.data[i * 4 + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  for (let i = 0; i < 260; i++) {
    const x = rng() * size, y = rng() * size, r = 2 + rng() * 12;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, rng() < 0.5 ? "rgba(0,0,0,0.10)" : "rgba(255,255,255,0.10)");
    g.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, 6.2832);
    ctx.fill();
  }
  const tex = new THREE.CanvasTexture(canvas);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return tex;
}

function createGlowTexture(inner, outer) {
  const s = 256;
  const canvas = document.createElement("canvas");
  canvas.width = canvas.height = s;
  const ctx = canvas.getContext("2d");
  const g = ctx.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  g.addColorStop(0, inner);
  g.addColorStop(0.35, outer);
  g.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, s, s);
  const tex = new THREE.CanvasTexture(canvas);
  tex.encoding = THREE.sRGBEncoding;
  return tex;
}

/* ------------------------------------------------------------------ *
 *  Renderer / scene
 * ------------------------------------------------------------------ */

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
} catch (e) {
  document.getElementById("app").innerHTML =
    '<div style="padding:40px;font-size:16px">WebGL is not available in this browser.</div>';
  throw e;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
document.getElementById("app").appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xe3c893, 140, 750);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 2000);

// Gradient sky via background canvas
(function createSky() {
  const c = document.createElement("canvas");
  c.width = 2; c.height = 512;
  const ctx = c.getContext("2d");
  const g = ctx.createLinearGradient(0, 0, 0, 512);
  g.addColorStop(0.00, "#2f5d9e");
  g.addColorStop(0.38, "#7fb2dd");
  g.addColorStop(0.58, "#c8dcea");
  g.addColorStop(0.74, "#ead9b4");
  g.addColorStop(1.00, "#e3c893");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 2, 512);
  const tex = new THREE.CanvasTexture(c);
  tex.encoding = THREE.sRGBEncoding;
  scene.background = tex;
})();

/* ------------------------------------------------------------------ *
 *  Lighting
 * ------------------------------------------------------------------ */

const hemi = new THREE.HemisphereLight(0xbdd7f2, 0xb59a72, 0.62);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff0d0, 2.05);
sun.position.set(-24, 32, 18);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -14;
sun.shadow.camera.right = 14;
sun.shadow.camera.top = 14;
sun.shadow.camera.bottom = -14;
sun.shadow.camera.near = 5;
sun.shadow.camera.far = 90;
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.025;
scene.add(sun);

const fill = new THREE.DirectionalLight(0x9fb8dd, 0.4);
fill.position.set(-18, 9, -12);
scene.add(fill);

const sunGlow = new THREE.Sprite(new THREE.SpriteMaterial({
  map: createGlowTexture("rgba(255,250,230,1)", "rgba(255,226,160,0.55)"),
  transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending, depthWrite: false
}));
sunGlow.position.copy(sun.position).normalize().multiplyScalar(560);
sunGlow.scale.setScalar(150);
scene.add(sunGlow);

/* ------------------------------------------------------------------ *
 *  Ground and environment
 * ------------------------------------------------------------------ */

const GROUND_SIZE = 1800;
const GROUND_REPEAT = 120;
const groundTile = GROUND_SIZE / GROUND_REPEAT;

const noiseTex = createNoiseTexture(4242);
const groundMat = new THREE.MeshStandardMaterial({
  map: new THREE.CanvasTexture(createGroundTexture(77)),
  bumpMap: noiseTex,
  bumpScale: 0.12,
  roughness: 1,
  metalness: 0
});
groundMat.map.wrapS = groundMat.map.wrapT = THREE.RepeatWrapping;
groundMat.map.repeat.set(GROUND_REPEAT, GROUND_REPEAT);
groundMat.map.encoding = THREE.sRGBEncoding;
groundMat.map.anisotropy = renderer.capabilities.getMaxAnisotropy();

const ground = new THREE.Mesh(new THREE.PlaneGeometry(GROUND_SIZE, GROUND_SIZE), groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Cross-quads for grass tufts
function createCrossGeometry(w, h) {
  const geo = new THREE.BufferGeometry();
  const positions = [], uvs = [], normals = [], indices = [];
  function quad(ax, ay, az, bx, by, bz, cx, cy, cz, dx, dy, dz, nx, ny, nz) {
    const i0 = positions.length / 3;
    positions.push(ax, ay, az, bx, by, bz, cx, cy, cz, dx, dy, dz);
    normals.push(nx, ny, nz, nx, ny, nz, nx, ny, nz, nx, ny, nz);
    uvs.push(0, 0, 1, 0, 1, 1, 0, 1);
    indices.push(i0, i0 + 1, i0 + 2, i0, i0 + 2, i0 + 3);
  }
  quad(-w / 2, 0, 0, w / 2, 0, 0, w / 2, h, 0, -w / 2, h, 0, 0, 0, 1);
  quad(0, 0, -w / 2, 0, 0, w / 2, 0, h, w / 2, 0, h, -w / 2, 1, 0, 0);
  geo.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute("normal", new THREE.Float32BufferAttribute(normals, 3));
  geo.setAttribute("uv", new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(indices);
  return geo;
}

const grassMat = new THREE.MeshStandardMaterial({
  map: createGrassTexture(),
  alphaTest: 0.45,
  side: THREE.DoubleSide,
  roughness: 1,
  metalness: 0
});

const GRASS_COUNT = 280;
const grass = new THREE.InstancedMesh(createCrossGeometry(0.55, 0.75), grassMat, GRASS_COUNT);
grass.receiveShadow = true;
grass.frustumCulled = false;
const grassData = [];
const dummy = new THREE.Object3D();
function setGrassMatrix(i) {
  const d = grassData[i];
  dummy.position.set(d.x, 0, d.z);
  dummy.rotation.set(0, d.ry, 0);
  dummy.scale.setScalar(d.s);
  dummy.updateMatrix();
  grass.setMatrixAt(i, dummy.matrix);
}
for (let i = 0; i < GRASS_COUNT; i++) {
  let x, z;
  do {
    x = -30 + Math.random() * 60;
    z = -48 + Math.random() * 96;
  } while (Math.abs(x) < 2.1);
  grassData.push({ x, z, ry: Math.random() * Math.PI * 2, s: 0.7 + Math.random() * 0.95 });
  setGrassMatrix(i);
}
grass.instanceMatrix.needsUpdate = true;
scene.add(grass);

const ROCK_COUNT = 46;
const rocks = new THREE.InstancedMesh(
  new THREE.IcosahedronGeometry(1, 0),
  new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.96, metalness: 0, flatShading: true }),
  ROCK_COUNT
);
rocks.receiveShadow = true;
rocks.frustumCulled = false;
const rockData = [];
const rockColor = new THREE.Color();
for (let i = 0; i < ROCK_COUNT; i++) {
  let x, z;
  do {
    x = -36 + Math.random() * 72;
    z = -48 + Math.random() * 96;
  } while (Math.abs(x) < 1.7);
  const s = 0.12 + Math.random() * 0.42;
  const ry = Math.random() * Math.PI * 2;
  const rx = (Math.random() - 0.5) * 0.6;
  const rz = (Math.random() - 0.5) * 0.6;
  rockData.push({ x, z, s, ry, rx, rz });
  dummy.position.set(x, s * 0.32, z);
  dummy.rotation.set(rx, ry, rz);
  dummy.scale.set(s, s * (0.55 + Math.random() * 0.5), s);
  dummy.updateMatrix();
  rocks.setMatrixAt(i, dummy.matrix);
  rockColor.setHSL(0.09, 0.1 + Math.random() * 0.12, 0.3 + Math.random() * 0.2);
  rocks.setColorAt(i, rockColor);
}
rocks.instanceMatrix.needsUpdate = true;
if (rocks.instanceColor) rocks.instanceColor.needsUpdate = true;
scene.add(rocks);

function createAcacia(rng) {
  const g = new THREE.Group();
  const trunkMat = new THREE.MeshStandardMaterial({ color: 0x6b4f35, roughness: 0.95, metalness: 0 });
  const canopyMat = new THREE.MeshStandardMaterial({
    color: new THREE.Color().setHSL(0.23 + rng() * 0.04, 0.26 + rng() * 0.12, 0.24 + rng() * 0.08),
    roughness: 0.95, metalness: 0
  });
  const h = 5 + rng() * 3;
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.42, h, 7), trunkMat);
  trunk.position.y = h / 2;
  trunk.rotation.z = (rng() - 0.5) * 0.22;
  g.add(trunk);
  const branchCount = 2 + ((rng() * 2) | 0);
  for (let i = 0; i < branchCount; i++) {
    const bl = 1.4 + rng() * 2.1;
    const b = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.11, bl, 5), trunkMat);
    b.position.set((rng() - 0.5) * 1.3, h * 0.72 + rng() * h * 0.22, (rng() - 0.5) * 1.3);
    b.rotation.set((rng() - 0.5) * 1.1, rng() * 6.28, (rng() - 0.5) * 1.1);
    g.add(b);
  }
  const canopyCount = 3 + ((rng() * 3) | 0);

function coatTexture(canvas, rx, ry, ox, oy) {
  const tex = new THREE.CanvasTexture(canvas);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(rx, ry);
  tex.offset.set(ox, oy);
  tex.encoding = THREE.sRGBEncoding;
  tex.anisotropy = maxAniso;
  return tex;
}

function buildLeg(def) {
  const legRoot = new THREE.Group();
  legRoot.position.set(def.side * (def.front ? FRONT_X : HIND_X), def.front ? FRONT_PIVOT_Y : HIND_PIVOT_Y, def.front ? FRONT_Z : HIND_Z);

  addMesh(legRoot, new THREE.SphereGeometry(1, 16, 12), upperLegMat, [0, -0.16, 0], null,
    [def.front ? 0.21 : 0.24, 0.29, def.front ? 0.21 : 0.24]);
  if (!def.front) {
    addMesh(body, new THREE.SphereGeometry(1, 18, 14), upperLegMat, [def.side * 0.34, HIND_PIVOT_Y - 0.22, HIND_Z + 0.04], null, [0.28, 0.40, 0.36]);
  }
  const knee = new THREE.Group();
  knee.position.y = -upperLen;
  legRoot.add(knee);
  addMesh(knee, new THREE.SphereGeometry(1, 14, 10), lowerLegMat, null, null, [0.15, 0.17, 0.15]);
  addMesh(knee, new THREE.CylinderGeometry(0.085, 0.13, lowerLen, 12, 1), lowerLegMat, [0, -lowerLen / 2, 0]);

  const ankle = new THREE.Group();
  ankle.position.y = -lowerLen;
  knee.add(ankle);
  addMesh(ankle, new THREE.SphereGeometry(1, 12, 10), lowerLegMat, null, null, [0.095, 0.10, 0.095]);
  addMesh(ankle, new THREE.CylinderGeometry(0.10, 0.11, footLen, 12, 1), lowerLegMat, [0, -footLen / 2, 0]);
  const hoof = addMesh(ankle, new THREE.CylinderGeometry(0.118, 0.138, hoofLen, 14, 1), hoofMat, [0, -footLen - hoofLen / 2, 0]);

  return {
    root: legRoot, knee, ankle, hoof, def,
    upperLen, lowerLen, footLen, hoofLen,
    hipToAnkle: upperLen + lowerLen,
    ankleToHoof: footLen + hoofLen,
    pivotY: def.front ? FRONT_PIVOT_Y : HIND_PIVOT_Y
  };
}

/* ------------------------------------------------------------------ *
 *  Camera controls (custom orbit with damping, touch + pinch)
 * ------------------------------------------------------------------ */

const controls = {
  target: new THREE.Vector3(0, 2.55, 0.2),
  theta: -0.85, phi: 1.34, radius: 9.6,
  tTheta: -0.85, tPhi: 1.34, tRadius: 9.6,
  minR: 3.5, maxR: 45, minPhi: 0.12, maxPhi: 1.50
};

const canvas = renderer.domElement;
const pointers = new Map();
let lastPinch = 0;

canvas.addEventListener("pointerdown", e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
});
canvas.addEventListener("pointermove", e => {
  if (!pointers.has(e.pointerId)) return;
  const p = pointers.get(e.pointerId);
  const dx = e.clientX - p.x;
  const dy = e.clientY - p.y;
  p.x = e.clientX;
  p.y = e.clientY;
  if (pointers.size === 1) {
    controls.tTheta -= dx * 0.005;
    controls.tPhi = clamp(controls.tPhi - dy * 0.005, controls.minPhi, controls.maxPhi);
  } else if (pointers.size === 2) {
    const arr = [...pointers.values()];
    const dist = Math.hypot(arr[0].x - arr[1].x, arr[0].y - arr[1].y);
    if (lastPinch > 0 && dist > 0) {
      controls.tRadius = clamp(controls.tRadius * (lastPinch / dist), controls.minR, controls.maxR);
    }
    lastPinch = dist;
  }
});
const releasePointer = e => {
  pointers.delete(e.pointerId);
  lastPinch = 0;
};
window.addEventListener("pointerup", releasePointer);
window.addEventListener("pointercancel", releasePointer);
canvas.addEventListener("wheel", e => {
  e.preventDefault();
  controls.tRadius = clamp(controls.tRadius * Math.exp(e.deltaY * 0.0012), controls.minR, controls.maxR);
}, { passive: false });
canvas.addEventListener("contextmenu", e => e.preventDefault());

function resetCamera() {
  controls.tTheta = -0.85;
  controls.tPhi = 1.34;
  controls.tRadius = 9.6;
  controls.target.set(0, 2.55, 0.2);
}

function updateControls(dt) {
  const k = Math.min(1, dt * 8);
  controls.theta += (controls.tTheta - controls.theta) * k;
  controls.phi += (controls.tPhi - controls.phi) * k;
  controls.radius += (controls.tRadius - controls.radius) * k;
  const sp = Math.sin(controls.phi), cp = Math.cos(controls.phi);
  camera.position.set(
    controls.target.x + controls.radius * sp * Math.sin(controls.theta),
    controls.target.y + controls.radius * cp,
    controls.target.z + controls.radius * sp * Math.cos(controls.theta)
  );
  camera.lookAt(controls.target);
}

/* ------------------------------------------------------------------ *
 *  Gait + animation
 * ------------------------------------------------------------------ */

const params = { speed: 0.50, paused: false, autoOrbit: false };
let gaitTime = 0;
let travel = 0;
let worldSpeed = 0;
const _target = new THREE.Vector3();

function updateGiraffe(dt, elapsed) {
  if (!params.paused) gaitTime += dt * params.speed;
  const cycle = gaitTime - Math.floor(gaitTime);
  const w = Math.PI * 2 * cycle;
  const speedNorm = clamp((params.speed - 0.22) / 0.73, 0, 1);
  const strideScale = 0.78 + 0.45 * speedNorm;
  const liftScale = 0.75 + 0.45 * speedNorm;

  // ---- body pose first, so the leg IK can target world-space ground positions ----
  const dip = 0.5 + 0.5 * Math.cos(4 * Math.PI * (cycle - 0.05));
  body.position.y = -0.038 * dip;
  // At cycle 0 the left legs are the support side: sway/roll toward +x, neck counters to -x
  const swayPhase = Math.cos(w);
  body.position.x = 0.03 * swayPhase;
  body.rotation.z = -0.022 * swayPhase;
  body.rotation.y = 0.02 * Math.sin(w);
  body.rotation.x = 0.014 * Math.sin(4 * Math.PI * cycle + 0.8);
  body.updateMatrixWorld(true);

  // ---- legs: ground-placed foot targets solved with 2-bone IK ----
  for (const leg of legs) {
    const p = (cycle + leg.def.phase) % 1;
    const stride = leg.def.stride * strideScale;
    let targetX, lift = 0, swingShape = 0;
    if (p < GAIT_DUTY) {
      // Stance: foot travels backward at constant speed (matches the scrolling ground)
      targetX = stride * (0.5 - p / GAIT_DUTY);
    } else {
      // Swing: foot moves forward along an arc with smooth easing
      const q = (p - GAIT_DUTY) / (1 - GAIT_DUTY);
      const ease = q * q * (3 - 2 * q);
      targetX = stride * (ease - 0.5);
      lift = leg.def.lift * liftScale * Math.sin(Math.PI * q);
      swingShape = Math.sin(Math.PI * q);
    }

    // Desired ankle position in world space: hoof bottom rests on the ground (plus lift)
    const baseX = leg.def.side * (leg.def.front ? FRONT_X : HIND_X);
    const baseZ = leg.def.front ? FRONT_Z : HIND_Z;
    _target.set(baseX, leg.ankleToHoof + lift, baseZ + targetX);
    body.worldToLocal(_target);
    _target.sub(leg.root.position); // hip-local frame (x sideways, y up, z forward)

    const ankleDown = -_target.y;
    const maxReach = Math.sqrt(Math.max(leg.hipToAnkle * leg.hipToAnkle - ankleDown * ankleDown, 1e-6));
    const tx = clamp(_target.z, -maxReach, maxReach);
    const d = Math.min(Math.hypot(tx, ankleDown), leg.hipToAnkle - 0.002);

    // Law of cosines for the hip->ankle chain
    const alpha = Math.atan2(tx, ankleDown);
    const cosBeta = clamp((leg.upperLen * leg.upperLen + d * d - leg.lowerLen * leg.lowerLen) / (2 * leg.upperLen * d), -1, 1);
    const beta = Math.acos(cosBeta);
    const cosGamma = clamp((leg.upperLen * leg.upperLen + leg.lowerLen * leg.lowerLen - d * d) / (2 * leg.upperLen * leg.lowerLen), -1, 1);
    const gamma = Math.acos(cosGamma);

    const hip = -(alpha + beta);
    const knee = Math.PI - gamma;
    const ankle = -(body.rotation.x + hip + knee) + leg.def.toe * swingShape;
    leg.root.rotation.x = hip;
    leg.root.rotation.z = 0;
    leg.knee.rotation.x = knee;
    leg.ankle.rotation.x = ankle;
  }

  const avgStride = ((LEG_CONFIG[0].stride + LEG_CONFIG[2].stride) / 2) * strideScale;
  worldSpeed = params.paused ? 0 : avgStride * params.speed / GAIT_DUTY;

  // ---- neck ----
  const neckBaseOsc = 0.025 * Math.sin(4 * Math.PI * cycle + 0.6);
  neckBase.rotation.x = NECK_BASE_PITCH + neckBaseOsc;
  neckBase.rotation.z = 0.075 * swayPhase;
  neckBase.rotation.y = 0.03 * Math.sin(w);
  const osc2 = 0.018 * Math.sin(4 * Math.PI * cycle + 0.2);
  const osc3 = 0.018 * Math.sin(4 * Math.PI * cycle);
  neckSegs[1].rotation.x = NECK_SEG2_PITCH + osc2;
  neckSegs[2].rotation.x = NECK_SEG3_PITCH + osc3;
  const neckBend = neckBaseOsc + osc2 + osc3;
  head.rotation.x = HEAD_PITCH - 0.55 * neckBend + 0.012 * Math.sin(4 * Math.PI * cycle + 1.2);
  head.rotation.z = -0.6 * (body.rotation.z + neckBase.rotation.z);

  // ---- breathing ----
  const breathe = 1 + 0.007 * Math.sin(elapsed * 1.7);
  withers.scale.set(0.46 * breathe, 0.40 / breathe, 0.50);

  // ---- ears / blink ----
  for (let i = 0; i < 2; i++) {
    const side = i === 0 ? 1 : -1;
    const ear = i === 0 ? earL : earR;
    const tw = ((elapsed * 0.22 + i * 0.5) % 1);
    const twitch = tw < 0.07 ? Math.sin(tw / 0.07 * Math.PI) : 0;
    ear.rotation.z = -side * 0.95 + side * (0.05 * Math.sin(elapsed * 0.6 + i * 2.1) + 0.3 * twitch);
  }
  const bt = (elapsed * 0.17 + 0.35) % 1;
  const blink = bt < 0.035 ? Math.sin(bt / 0.035 * Math.PI) : 0;
  eyeL.scale.y = 1 - 0.85 * blink;
  eyeR.scale.y = 1 - 0.85 * blink;

  // ---- tail ----
  tailRoot.rotation.z = 0.18 * Math.sin(w + 0.4);
  tailRoot.rotation.x = TAIL_BASE_PITCH + 0.06 * Math.sin(4 * Math.PI * cycle + 1.0);
  tailMid.rotation.z = 0.25 * Math.sin(w - 0.2);
  tailMid.rotation.x = TAIL_MID_PITCH + 0.10 * Math.sin(4 * Math.PI * cycle - 0.6);
  tailTuft.rotation.x = 0.25 + 0.12 * Math.sin(w + 0.9);
}

function updateWorld(dt) {
  if (worldSpeed > 0) {
    travel += worldSpeed * dt;
    groundMat.map.offset.y = ((-travel / groundTile) % 1 + 1) % 1;

    for (let i = 0; i < GRASS_COUNT; i++) {
      const d = grassData[i];
      d.z -= worldSpeed * dt;
      if (d.z < -48) {
        d.z += 96;
        d.x = -30 + Math.random() * 60;
        if (Math.abs(d.x) < 2.1) d.x += d.x < 0 ? -2.2 : 2.2;
        d.ry = Math.random() * Math.PI * 2;
        d.s = 0.7 + Math.random() * 0.95;
      }
      setGrassMatrix(i);
    }
    grass.instanceMatrix.needsUpdate = true;

    for (let i = 0; i < ROCK_COUNT; i++) {
      const d = rockData[i];
      d.z -= worldSpeed * dt;
      if (d.z < -48) {
        d.z += 96;
        d.x = -36 + Math.random() * 72;
        if (Math.abs(d.x) < 1.7) d.x += d.x < 0 ? -1.8 : 1.8;
      }
      dummy.position.set(d.x, d.s * 0.32, d.z);
      dummy.rotation.set(d.rx, d.ry, d.rz);
      dummy.scale.set(d.s, d.s * (0.55 + Math.random() * 0.5), d.s);
      dummy.updateMatrix();
      rocks.setMatrixAt(i, dummy.matrix);
    }
    rocks.instanceMatrix.needsUpdate = true;

    for (const tree of trees) {
      tree.position.z -= worldSpeed * dt;
      if (tree.position.z < -160) tree.position.z += 320;
    }
  }
}

/* ------------------------------------------------------------------ *
 *  UI
 * ------------------------------------------------------------------ */

const playBtn = document.getElementById("playBtn");
const resetBtn = document.getElementById("resetBtn");
const speedInput = document.getElementById("speed");
const speedVal = document.getElementById("speedVal");
const autoOrbit = document.getElementById("autoOrbit");

function setPaused(p) {
  params.paused = p;
  playBtn.textContent = p ? "Play" : "Pause";
}
playBtn.addEventListener("click", () => setPaused(!params.paused));
resetBtn.addEventListener("click", resetCamera);
speedInput.addEventListener("input", () => {
  params.speed = parseFloat(speedInput.value);
  speedVal.textContent = params.speed.toFixed(2);
});
autoOrbit.addEventListener("change", () => { params.autoOrbit = autoOrbit.checked; });

window.addEventListener("keydown", e => {
  if (e.code === "Space") {
    e.preventDefault();
    setPaused(!params.paused);
  } else if (e.key === "r" || e.key === "R") {
    resetCamera();
  } else if (e.key === "o" || e.key === "O") {
    autoOrbit.checked = !autoOrbit.checked;
    params.autoOrbit = autoOrbit.checked;
  }
});

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ------------------------------------------------------------------ *
 *  Main loop
 * ------------------------------------------------------------------ */

const clock = new THREE.Clock();
let elapsed = 0;
let frameCount = 0;

function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;
  frameCount++;
  updateGiraffe(dt, elapsed);
  updateWorld(dt);
  if (params.autoOrbit) controls.tTheta -= 0.07 * dt;
  updateControls(dt);
  renderer.render(scene, camera);
}
renderer.setAnimationLoop(animate);

// Small inspection hook (used for automated visual checks; harmless in normal use)
window.__debug = {
  legs, body, head, neckBase, neckSegs, tailRoot, params, camera, controls, scene, renderer, sun,
  eyeL, eyeR, earL, earR, ossicones, skullMesh, muzzleMesh,
  setGait(t) { gaitTime = t; },
  hoofWorld(key) {
    const leg = legs.find(l => l.def.key === key);
    return leg.hoof.getWorldPosition(new THREE.Vector3()).toArray();
  },
  hoofBottomWorld(key) {
    const leg = legs.find(l => l.def.key === key);
    return new THREE.Box3().setFromObject(leg.hoof).min.y;
  },
  ankleWorld(key) {
    const leg = legs.find(l => l.def.key === key);
    return leg.ankle.getWorldPosition(new THREE.Vector3()).toArray();
  },
  bounds() {
    const b = new THREE.Box3().setFromObject(root);
    return { min: b.min.toArray(), max: b.max.toArray(), size: b.getSize(new THREE.Vector3()).toArray() };
  },
  headBounds() {
    const b = new THREE.Box3().setFromObject(head);
    return { min: b.min.toArray(), max: b.max.toArray(), size: b.getSize(new THREE.Vector3()).toArray() };
  },
  neckBounds() {
    const b = new THREE.Box3().setFromObject(neckBase);
    return { min: b.min.toArray(), max: b.max.toArray(), size: b.getSize(new THREE.Vector3()).toArray() };
  },
  project(obj) {
    const v = new THREE.Box3().setFromObject(obj).getCenter(new THREE.Vector3());
    const p = v.clone().project(camera);
    return [(p.x + 1) / 2 * window.innerWidth, (1 - p.y) / 2 * window.innerHeight];
  },
  get landmarks() {
    return {
      skull: this.project(skullMesh),
      muzzle: this.project(muzzleMesh),
      eyeL: this.project(eyeL),
      eyeR: this.project(eyeR),
      earL: this.project(earL),
      earR: this.project(earR),
      ossL: this.project(ossicones[0]),
      ossR: this.project(ossicones[1]),
      neck: this.project(neckBase),
      withers: this.project(withers)
    };
  },
  snapshot() {
    return { travel, hooves: legs.map(l => ({ key: l.def.key, p: l.hoof.getWorldPosition(new THREE.Vector3()).toArray() })) };
  },
  get state() {
    return {
      frames: frameCount, elapsed, gaitTime, travel, worldSpeed,
      legs: legs.map(l => ({ key: l.def.key, hip: l.root.rotation.x, knee: l.knee.rotation.x, ankle: l.ankle.rotation.x }))
    };
  }
};

// First pose before the first frame
updateGiraffe(0, 0);
updateControls(1);
</script>
