<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giraffa camelopardalis — Realistic Walking Giraffe in Three.js</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a1510;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #f5efe6;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #canvas-container canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }

    #canvas-container canvas:active {
      cursor: grabbing;
    }

    /* Discreet Title Badge */
    #title-badge {
      position: fixed;
      top: 18px;
      left: 20px;
      pointer-events: none;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.45);
      z-index: 10;
    }

    #title-badge h1 {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: rgba(255, 248, 236, 0.94);
    }

    #title-badge p {
      font-size: 11.5px;
      font-style: italic;
      color: rgba(255, 236, 206, 0.72);
      margin-top: 2px;
      letter-spacing: 0.03em;
    }

    /* Glassmorphic Controls Panel */
    #hud-root {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }

    #btn-toggle-hud {
      background: rgba(26, 20, 15, 0.52);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 235, 205, 0.18);
      color: rgba(255, 245, 230, 0.9);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 6px 11px;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.18s ease, border-color 0.18s ease;
    }

    #btn-toggle-hud:hover {
      background: rgba(45, 34, 24, 0.74);
      border-color: rgba(255, 215, 160, 0.38);
    }

    #hud-panel {
      width: 244px;
      background: rgba(24, 18, 13, 0.58);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 232, 200, 0.16);
      border-radius: 14px;
      padding: 13px 14px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.34);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    #hud-panel.collapsed {
      opacity: 0;
      pointer-events: none;
      transform: translateY(-6px);
    }

    .hud-section {
      margin-bottom: 12px;
    }

    .hud-section:last-child {
      margin-bottom: 0;
    }

    .hud-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(245, 224, 195, 0.68);
      margin-bottom: 7px;
    }

    .hud-label span.val {
      color: #f6cfa0;
      font-variant-numeric: tabular-nums;
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .pill-btn {
      flex: 1 1 auto;
      background: rgba(255, 244, 228, 0.08);
      border: 1px solid rgba(255, 234, 205, 0.14);
      color: rgba(255, 245, 232, 0.86);
      font-size: 11px;
      font-weight: 500;
      padding: 5px 8px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.16s ease;
      white-space: nowrap;
    }

    .pill-btn:hover {
      background: rgba(255, 232, 196, 0.18);
      border-color: rgba(255, 215, 160, 0.35);
    }

    .pill-btn.active {
      background: rgba(226, 152, 74, 0.34);
      border-color: rgba(246, 189, 118, 0.72);
      color: #fff6ea;
    }

    .gait-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #btn-play-pause {
      min-width: 58px;
      flex: 0 0 auto;
    }

    #btn-play-pause.paused {
      background: rgba(226, 152, 74, 0.34);
      border-color: rgba(246, 189, 118, 0.72);
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      background: rgba(255, 235, 205, 0.22);
      border-radius: 999px;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #f2bc79;
      border: 2px solid #2b1d12;
      cursor: pointer;
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.45);
    }

    .hud-hint {
      font-size: 10px;
      color: rgba(245, 224, 195, 0.48);
      margin-top: 8px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="title-badge">
    <h1>Reticulated Giraffe</h1>
    <p>Giraffa reticulata &middot; Ipsilateral Pacing Walk</p>
  </div>

  <div id="hud-root">
    <button id="btn-toggle-hud" type="button">Hide</button>
    <div id="hud-panel">
      <div class="hud-section">
        <div class="hud-label">
          <span>Gait Speed</span>
          <span class="val" id="speed-value">1.00&times;</span>
        </div>
        <div class="gait-row">
          <button id="btn-play-pause" class="pill-btn" type="button">Pause</button>
          <input id="speed-slider" type="range" min="0" max="1.6" step="0.05" value="1.0" />
        </div>
      </div>

      <div class="hud-section">
        <div class="hud-label"><span>Camera View</span></div>
        <div class="btn-row">
          <button class="pill-btn active" data-cam="hero" type="button">Hero 3/4</button>
          <button class="pill-btn" data-cam="profile" type="button">Side Gait</button>
          <button class="pill-btn" data-cam="head" type="button">Head</button>
          <button class="pill-btn" data-cam="front" type="button">Low Front</button>
          <button class="pill-btn" data-cam="legs" type="button">Legs</button>
        </div>
      </div>

      <div class="hud-section">
        <div class="hud-label"><span>Savannah Light</span></div>
        <div class="btn-row">
          <button class="pill-btn active" data-tod="golden" type="button">Golden</button>
          <button class="pill-btn" data-tod="midday" type="button">Noon</button>
          <button class="pill-btn" data-tod="sunset" type="button">Dusk</button>
        </div>
      </div>

      <div class="hud-hint">
        Drag to orbit &middot; Scroll to zoom &middot; Space pause &middot; 1&ndash;5 views
      </div>
    </div>
  </div>

  <!-- Local Three.js & Modules: runs directly via file:// with zero server or build step -->
  <script src="lib/three.min.js"></script>
  <script src="lib/OrbitControls.js"></script>
  <script src="js/math-utils.js"></script>
  <script src="js/coat-material.js"></script>
  <script src="js/giraffe-skeleton.js"></script>
  <script src="js/giraffe-mesh.js"></script>
  <script src="js/giraffe-gait.js"></script>
  <script src="js/savannah-env.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
