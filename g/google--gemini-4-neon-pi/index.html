<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giraffa camelopardalis — Realistic Walking Giraffe in Three.js</title>
  <style>
    :root {
      --bg-glass: rgba(24, 18, 12, 0.56);
      --border-glass: rgba(255, 232, 194, 0.18);
      --text-main: #f6ead6;
      --text-muted: rgba(246, 234, 214, 0.68);
      --accent: #e0a653;
      --accent-soft: rgba(224, 166, 83, 0.24);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1c1610;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
    }

    #viewport {
      width: 100%;
      height: 100%;
      position: fixed;
      inset: 0;
      cursor: grab;
    }

    #viewport:active {
      cursor: grabbing;
    }

    #title-badge {
      position: fixed;
      top: 18px;
      left: 20px;
      pointer-events: none;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.45);
      user-select: none;
    }

    #title-badge h1 {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #fff3dd;
    }

    #title-badge p {
      font-size: 12px;
      font-style: italic;
      color: rgba(255, 240, 214, 0.78);
      margin-top: 2px;
      letter-spacing: 0.02em;
    }

    #btn-toggle-ui {
      position: fixed;
      top: 16px;
      right: 18px;
      z-index: 20;
      background: var(--bg-glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-glass);
      color: var(--text-main);
      padding: 7px 13px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.18s ease, border-color 0.18s ease;
    }

    #btn-toggle-ui:hover {
      background: rgba(38, 28, 18, 0.78);
      border-color: rgba(255, 232, 194, 0.36);
    }

    #hud-panel {
      position: fixed;
      bottom: 18px;
      right: 18px;
      width: 288px;
      z-index: 15;
      background: var(--bg-glass);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border-glass);
      border-radius: 14px;
      padding: 14px 15px;
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.36);
      transition: opacity 0.22s ease, transform 0.22s ease;
    }

    #hud-panel.hidden {
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
    }

    .hud-section {
      margin-bottom: 12px;
    }

    .hud-section:last-child {
      margin-bottom: 0;
    }

    .hud-label {
      font-size: 10.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--text-muted);
      margin-bottom: 7px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .pill-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
    }

    .pill-btn {
      background: rgba(255, 245, 228, 0.07);
      border: 1px solid rgba(255, 232, 194, 0.14);
      color: var(--text-main);
      padding: 6px 4px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.16s ease;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pill-btn:hover {
      background: rgba(255, 245, 228, 0.16);
      border-color: rgba(255, 232, 194, 0.32);
    }

    .pill-btn.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: #fff6e6;
    }

    .controls-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #btn-play-pause {
      flex: 0 0 82px;
      padding: 6px 10px;
      border-radius: 8px;
      background: var(--accent-soft);
      border: 1px solid var(--accent);
      color: #fff6e6;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
    }

    #btn-play-pause:hover {
      background: rgba(224, 166, 83, 0.36);
    }

    .slider-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
      cursor: pointer;
      height: 4px;
    }

    #speed-val {
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      color: var(--text-main);
      min-width: 34px;
      text-align: right;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11.5px;
      color: var(--text-muted);
      padding-top: 4px;
      border-top: 1px solid rgba(255, 232, 194, 0.10);
    }

    .toggle-row label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      color: var(--text-main);
    }

    .hint-text {
      font-size: 10px;
      color: rgba(246, 234, 214, 0.52);
    }

    .gait-meter {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
      margin-top: 8px;
    }

    .hoof-pill {
      text-align: center;
      font-size: 9.5px;
      font-weight: 600;
      letter-spacing: 0.05em;
      padding: 3px 0;
      border-radius: 5px;
      border: 1px solid rgba(255, 232, 194, 0.14);
      background: rgba(255, 245, 228, 0.05);
      color: rgba(246, 234, 214, 0.45);
      transition: background 0.10s ease, color 0.10s ease, border-color 0.10s ease;
    }

    .hoof-pill.stance {
      background: rgba(224, 166, 83, 0.28);
      border-color: rgba(224, 166, 83, 0.72);
      color: #fff6e6;
    }
  </style>
</head>
<body>
  <div id="viewport"></div>

  <div id="title-badge">
    <h1>Giraffa camelopardalis</h1>
    <p>Lateral-pacing biomechanics &middot; Serengeti savanna</p>
  </div>

  <button id="btn-toggle-ui" type="button">Hide UI</button>

  <aside id="hud-panel">
    <div class="hud-section">
      <div class="hud-label">
        <span>Camera View</span>
        <span class="hint-text">Keys 1–6 &middot; Drag to orbit</span>
      </div>
      <div class="pill-grid" id="cam-buttons"></div>
    </div>

    <div class="hud-section">
      <div class="hud-label"><span>Lighting</span><span class="hint-text">Key L</span></div>
      <div class="pill-grid" id="light-buttons"></div>
    </div>

    <div class="hud-section">
      <div class="hud-label"><span>Gait Playback</span><span class="hint-text">Space</span></div>
      <div class="controls-row">
        <button id="btn-play-pause" type="button">❚❚ Pause</button>
        <div class="slider-wrap">
          <input id="slider-speed" type="range" min="0.15" max="1.8" step="0.05" value="1.0" />
          <span id="speed-val">1.00×</span>
        </div>
      </div>
      <div class="gait-meter" title="Real-time ipsilateral pacing contact (amber = grounded stance)">
        <div class="hoof-pill" id="hoof-hl">LH</div>
        <div class="hoof-pill" id="hoof-fl">LF</div>
        <div class="hoof-pill" id="hoof-hr">RH</div>
        <div class="hoof-pill" id="hoof-fr">RF</div>
      </div>
    </div>

    <div class="hud-section toggle-row">
      <label>
        <input id="chk-follow" type="checkbox" checked />
        Follow giraffe
      </label>
      <span class="hint-text">R reset &middot; H hide UI</span>
    </div>
  </aside>

  <!-- Self-contained Three.js r147 (runs directly via file:// with no server or build step) -->
  <script src="./vendor/three.min.js"></script>
  <script src="./vendor/OrbitControls.js"></script>
  <script src="./src/math.js"></script>
  <script src="./src/materials.js"></script>
  <script src="./src/skeleton.js"></script>
  <script src="./src/giraffeMesh.js"></script>
  <script src="./src/gait.js"></script>
  <script src="./src/environment.js"></script>
  <script src="./src/main.js"></script>
</body>
</html>
